name: Continuous Deployment (CD)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build, Push & Deploy to AWS EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/reviewlens-backend:latest -f server/Dockerfile server
          docker push $ECR_REGISTRY/reviewlens-backend:latest

      - name: Build & Push Frontend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/reviewlens-frontend:latest -f Dockerfile .
          docker push $ECR_REGISTRY/reviewlens-frontend:latest

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name reviewlens-kubernetes-cluster

      - name: Deploy to Kubernetes (EKS)
        run: |
          sed -i "s|image: node:20-alpine|image: ${{ steps.login-ecr.outputs.registry }}/reviewlens-backend:latest|g" k8s/backend-deployment.yaml
          sed -i "s|image: nginx:alpine|image: ${{ steps.login-ecr.outputs.registry }}/reviewlens-frontend:latest|g" k8s/frontend-deployment.yaml
          kubectl apply -f k8s/
