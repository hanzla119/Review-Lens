# ========================================================
# HIGH-PERFORMANCE NGINX WEB & REVERSE PROXY GATEWAY
# ========================================================

server {
    listen 80;
    server_name localhost;

    # Enable Gzip compression to deliver files faster over the network
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. SERVE STATIC REACT ASSETS
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Fallback to index.html for Single Page Application (SPA) routing
        try_files $uri $uri/ /index.html;
    }

    # 2. REVERSE PROXY: Forward all API calls securely to the backend container
    # Eliminates CORS issues since the browser only communicates with Port 80
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
